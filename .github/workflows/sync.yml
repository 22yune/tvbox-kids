name: sync-catalog

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync CCTV catalog
        env:
          KIDS_BASE_URL: ${{ vars.KIDS_BASE_URL }}
        run: node scripts/sync.mjs --verify

      - name: Check generated files
        run: node scripts/check.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json spider/kids.js kids.json
          git diff --cached --quiet || git commit -m "chore: sync catalog $(date -u +%F)"
          git push
