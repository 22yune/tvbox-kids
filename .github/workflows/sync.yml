name: sync-catalog

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "spider-src/**"
      - "spider-stub/**"
      - "scripts/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Sync CCTV catalog
        env:
          KIDS_BASE_URL: ${{ vars.KIDS_BASE_URL }}
          KIDS_JAR_URL: ${{ vars.KIDS_JAR_URL }}
          KIDS_USE_RAW: ${{ vars.KIDS_USE_RAW }}
          # 备用线路由本地脚本解析后提交，CI 只沿用结果，避免每次同步扫几十个采集站。
          KIDS_SKIP_BACKUPS: "1"
        run: node scripts/sync.mjs --verify

      - name: Check generated files
        run: node scripts/check.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/curated_catalog.json spider/kids.jar spider-src kids.json
          git diff --cached --quiet || git commit -m "chore: sync catalog $(date -u +%F)"
          git push
